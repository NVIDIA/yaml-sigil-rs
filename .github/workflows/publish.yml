name: Publish

# This workflow distributes four crates.io source packages and creates
# annotated package tags plus source-only GitHub Releases. It builds, uploads,
# and retains no executable artifact.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions: {}

env:
  # Resolve the manifests' explicit `crates-io` publish allowlists by name.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable, so never cancel a run that may already have
# uploaded a source package while a replacement waits for approval.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate invocation
        env:
          EXPECTED_REPOSITORY: NVIDIA/yaml-sigil-rs
        run: |
          # Prevent a copied workflow from operating in another repository.
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "This workflow runs only in ${EXPECTED_REPOSITORY}." >&2
            exit 1
          fi
          # Official release authority belongs only to exact protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
            || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Official release operations must use exact main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo xtask release install-tools

      - name: Configure read-only release forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Require a committed synchronized release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Require exact traits availability and source
        run: cargo xtask release verify-traits

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          current_version="$(cargo xtask release-version show)"
          python3 .github/scripts/prepare_release_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"

      - name: Require the tagged baseline on crates.io
        run: >-
          cargo xtask release verify-registry
          --check-version "${{ steps.baseline.outputs.version }}"
          yaml-sigil-core
          yaml-sigil-transcription
          yaml-sigil-signing
          yaml-sigil-verification

      - name: Check release API compatibility
        run: |
          current_version="$(cargo xtask release-version show)"
          intent="$(cargo xtask release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          cargo xtask release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"

      # Require the exact dependency-safe package order and reject executable
      # targets before any release-plz invocation.
      - name: Require the exact source-package inventory
        run: >-
          cargo xtask release check-packages
          yaml-sigil-core
          yaml-sigil-transcription
          yaml-sigil-signing
          yaml-sigil-verification

      # Patch only unpublished workspace dependencies in a dedicated Cargo
      # home so Cargo and release-plz can validate the current source train.
      - name: Prepare validation-only Cargo configuration
        run: |
          validation_cargo_home="${RUNNER_TEMP}/yaml-sigil-rs-release-cargo-home"
          cargo xtask release prepare-validation-cargo-home \
            --output "${validation_cargo_home}"
          printf 'CARGO_HOME=%s\n' "${validation_cargo_home}" >>"${GITHUB_ENV}"

      # Keep signing ahead of verification because Cargo resolves the latter's
      # signing development dependency during publication preparation.
      - name: Package with Cargo
        run: |
          cargo package --package yaml-sigil-core --all-features
          cargo package --package yaml-sigil-transcription
          cargo package --package yaml-sigil-signing --all-features
          cargo package --package yaml-sigil-verification --all-features

      - name: Require exact merged release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verify_release_publication_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"

      # Change only release-plz's publication switch and impossible branch
      # prefix so it cannot replace the already authorized current checkout.
      - name: Prepare checkout-bound release configuration
        run: |
          cargo xtask release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Validate release-plz publication plan
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Exercise package selection and forge discovery without OIDC or writes.
          release-plz release \
            --dry-run \
            --forge github \
            --config "${RUNNER_TEMP}/release-plz-publication.toml" \
            --manifest-path Cargo.toml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

  publication:
    name: Publish release
    if: ${{ inputs.operation == 'publish' }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      # Create annotated package tags and source-only Releases after publication.
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo xtask release install-tools

      - name: Configure protected publication forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Recheck the committed synchronized release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Recheck exact traits availability and source
        run: cargo xtask release verify-traits

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          current_version="$(cargo xtask release-version show)"
          python3 .github/scripts/prepare_release_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"

      - name: Require the tagged baseline on crates.io
        run: >-
          cargo xtask release verify-registry
          --check-version "${{ steps.baseline.outputs.version }}"
          yaml-sigil-core
          yaml-sigil-transcription
          yaml-sigil-signing
          yaml-sigil-verification

      - name: Recheck release API compatibility
        run: |
          current_version="$(cargo xtask release-version show)"
          intent="$(cargo xtask release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          cargo xtask release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"

      - name: Recheck the exact source-package inventory
        run: >-
          cargo xtask release check-packages
          yaml-sigil-core
          yaml-sigil-transcription
          yaml-sigil-signing
          yaml-sigil-verification

      # Use a new unpatched Cargo home so the OIDC-authorized job exercises the
      # same registry dependency ordering required by a real crates.io upload.
      - name: Prepare publication Cargo configuration
        run: |
          publication_cargo_home="${RUNNER_TEMP}/yaml-sigil-rs-publication-cargo-home"
          cargo xtask release prepare-publication-cargo-home \
            --output "${publication_cargo_home}"
          printf 'CARGO_HOME=%s\n' "${publication_cargo_home}" >>"${GITHUB_ENV}"

      # Change only release-plz's publication switch and impossible branch
      # prefix so it cannot replace the already authorized current checkout.
      - name: Prepare checkout-bound release configuration
        run: |
          cargo xtask release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Publish with Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          set +e
          cargo xtask release verify-registry \
            --check-version "${version}" \
            yaml-sigil-core \
            yaml-sigil-transcription \
            yaml-sigil-signing \
            yaml-sigil-verification
          registry_status="$?"
          set -e
          python3 .github/scripts/verify_release_publication_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=remote.origin.pushurl \
            GIT_CONFIG_VALUE_0=disabled://yaml-sigil-release-proposal \
            python3 .github/scripts/prepare_release_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_SHA}" \
            --verify-inventory "${{ steps.baseline.outputs.inventory }}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Complete publication selects metadata recovery. Any absent package
          # permits a fresh or fail-closed resumed Trusted Publishing attempt.
          case "${registry_status}" in
            0)
              python3 .github/scripts/reconcile_release_objects.py \
                --repository "${GITHUB_REPOSITORY}" \
                --version "${version}" \
                --commit "${GITHUB_SHA}" \
                --mode preflight
              echo "All exact crates are published; skipping registry mutation."
              ;;
            3)
              python3 .github/scripts/reconcile_release_objects.py \
                --repository "${GITHUB_REPOSITORY}" \
                --version "${version}" \
                --commit "${GITHUB_SHA}" \
                --mode prepublish
              cargo xtask release require-current-main \
                --head "${GITHUB_SHA}" \
                --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              # Exchange only this protected job's OIDC identity, publish the
              # source packages, and create annotated tags and Releases.
              release-plz release \
                --forge github \
                --config "${RUNNER_TEMP}/release-plz-publication.toml" \
                --manifest-path Cargo.toml
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              ;;
            *)
              echo "The exact crates.io publication state is invalid." >&2
              exit 1
              ;;
          esac

      - name: Verify crates.io publication
        run: >-
          cargo xtask release verify-registry
          yaml-sigil-core
          yaml-sigil-transcription
          yaml-sigil-signing
          yaml-sigil-verification

      - name: Verify or recover source-only release objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Recovery can create only missing annotated tags and Releases after
          # it independently rechecks every exact non-yanked registry package.
          python3 .github/scripts/reconcile_release_objects.py \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${version}" \
            --commit "${GITHUB_SHA}" \
            --mode recover

      - name: Request the next release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          jq --null-input --arg version "${version}" \
            '{event_type: "official-release-published", client_payload: {version: $version}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
