name: Publish

# This workflow publishes only crates.io source packages. It never uploads or
# retains executable artifacts, installers, containers, or release assets.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Validate a base, release support, or recover an exact source.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - release
          - recover
      base_ref:
        description: Exact main or canonical support/M.N base; execution stays on main.
        required: true
        default: refs/heads/main
        type: string
      version:
        description: Exact version; required for support release and recovery.
        required: false
        type: string
      source_sha:
        description: Full selected source SHA; validation uses the selected base tip.
        required: true
        type: string
      original_run_id:
        description: Original run ID; support recovery treats it as audit context.
        required: false
        type: string
      original_run_attempt:
        description: Exact original attempt (recovery only).
        required: false
        type: string

permissions: {}

concurrency:
  group: yaml-sigil-publish-v2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact source release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    outputs:
      mode: ${{ steps.invocation.outputs.mode }}
      base_ref: ${{ steps.qualify.outputs.base_ref }}
      operation: ${{ steps.qualify.outputs.operation }}
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      version: ${{ steps.qualify.outputs.version }}
      release_config: ${{ steps.qualify.outputs.release_config }}
      publish: ${{ steps.qualify.outputs.publish }}
      finalize: ${{ steps.qualify.outputs.finalize }}
      registry_state: ${{ steps.qualify.outputs.registry_state }}
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      # A moved main requires a fresh dispatch with its reviewed workflow policy.
      - name: Bind protected policy to the workflow commit
        run: test "$(git -C policy rev-parse HEAD)" = "${GITHUB_SHA}"

      # Only protected main binds inputs before the separate source checkout.
      - name: Bind selected release invocation
        id: invocation
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          INPUT_BASE: ${{ inputs.base_ref }}
          INPUT_SOURCE: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUN_ID: ${{ inputs.original_run_id }}
          INPUT_ATTEMPT: ${{ inputs.original_run_attempt }}
        run: policy/.github/scripts/bind-release-invocation.sh

      - name: Check out exact requested source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ steps.invocation.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Qualify the selected exact source
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.invocation.outputs.base_ref }}
          SOURCE_SHA: ${{ steps.invocation.outputs.source_sha }}
          SELECTED_VERSION: ${{ steps.invocation.outputs.version }}
          QUALIFY_MODE: ${{ steps.invocation.outputs.mode }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
        shell: bash
        run: |
          args=(github release qualify --base-ref "${BASE_REF}"
            --source-root ../release-source --source-sha "${SOURCE_SHA}"
            --operation "${QUALIFY_MODE}")
          # Bind an explicit operator version without guessing from the dispatch ref.
          if [[ -n "${SELECTED_VERSION}" ]]; then
            args+=(--version "${SELECTED_VERSION}")
          fi
          # Main recovery validates this run; support retains it as audit context.
          if [[ "${QUALIFY_MODE}" == recover ]]; then
            args+=(--original-run-id "${ORIGINAL_RUN_ID}"
              --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}")
          fi
          cargo xtask "${args[@]}"
        working-directory: policy

      - name: Validate nonempty release source
        if: ${{ steps.qualify.outputs.registry_state == 'none' }}
        env:
          RELEASE_VERSION: ${{ steps.qualify.outputs.version }}
          BASE_REF: ${{ steps.qualify.outputs.base_ref }}
        run: |
          # Qualification generated this ignored root lockfile. Remove only
          # that regular, untracked file before release-source validation.
          test -f Cargo.lock
          test ! -L Cargo.lock
          test -z "$(git ls-files -- Cargo.lock)"
          rm -- Cargo.lock
          # Content policy checks the exact source-version package family.
          cargo xtask release check --base-ref "${BASE_REF}" --version "${RELEASE_VERSION}"
        working-directory: release-source

  publish:
    name: Publish missing source crates
    needs: qualify
    if: ${{ needs.qualify.outputs.publish == 'true' }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 75
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      # A moved main requires a fresh dispatch with its reviewed workflow policy.
      - name: Bind protected policy to the workflow commit
        run: test "$(git -C policy rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install exact release-plz
        run: |
          # Install the sole Cargo publisher at its reviewed version.
          cargo binstall --force --locked --no-confirm release-plz@0.3.160
          # Refuse publication if the reviewed binary version is not active.
          release-plz --version | grep -Fx 'release-plz 0.3.160'

      - name: Requalify the selected source after approval
        id: requalify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          QUALIFY_MODE: ${{ needs.qualify.outputs.mode }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
        shell: bash
        run: |
          args=(github release qualify --base-ref "${BASE_REF}"
            --source-root ../release-source --source-sha "${SOURCE_SHA}"
            --version "${RELEASE_VERSION}" --operation "${QUALIFY_MODE}")
          # Recovery retains its original source and run context after approval.
          if [[ "${QUALIFY_MODE}" == recover ]]; then
            args+=(--original-run-id "${ORIGINAL_RUN_ID}"
              --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}")
          fi
          cargo xtask "${args[@]}"
        working-directory: policy

      - name: Attach exact source to the qualified local base refs
        if: ${{ steps.requalify.outputs.publish == 'true' }}
        env:
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: ../policy/.github/scripts/attach-release-source.sh "${SOURCE_SHA}" "${BASE_REF}"
        working-directory: release-source

      - name: Publish with release-plz
        if: ${{ steps.requalify.outputs.publish == 'true' }}
        env:
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          # release-plz resolves the explicit Cargo publish registry by name.
          CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          RELEASE_OPERATION: ${{ needs.qualify.outputs.operation }}
          QUALIFIED_VERSION: ${{ needs.qualify.outputs.version }}
          RELEASE_CONFIG: ${{ steps.requalify.outputs.release_config }}
          INITIAL_RELEASE_CONFIG: ${{ needs.qualify.outputs.release_config }}
        run: |
          # Re-read anonymous live main as the last policy operation before the
          # sole publisher receives this step's read-scoped GitHub token.
          ../policy/xtask/target/debug/xtask github release rebind-policy \
            --base-ref "${BASE_REF}" --operation "${RELEASE_OPERATION}" \
            --version "${QUALIFIED_VERSION}" \
            --source-root . --source-sha "${SOURCE_SHA}"
          # Requalification must retain the fixed source-version configuration.
          test "${RELEASE_CONFIG}" = "${INITIAL_RELEASE_CONFIG}"
          # release-plz is the sole Cargo publisher and native tag/Release
          # creation is disabled; only this process receives Git association.
          GIT_TOKEN="${{ github.token }}" release-plz release \
            --config "${RELEASE_CONFIG}" \
            --manifest-path Cargo.toml
        working-directory: release-source

  await_registry:
    name: Confirm exact published sources
    needs:
      - qualify
      - publish
    if: >-
      ${{ always() &&
          needs.qualify.result == 'success' &&
          needs.qualify.outputs.finalize == 'true' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      # A moved main requires a fresh dispatch with its reviewed workflow policy.
      - name: Bind protected policy to the workflow commit
        run: test "$(git -C policy rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Confirm all exact published source archives
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          QUALIFY_MODE: ${{ needs.qualify.outputs.mode }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
        shell: bash
        run: |
          args=(github release qualify --base-ref "${BASE_REF}"
            --source-root ../release-source --source-sha "${SOURCE_SHA}"
            --version "${RELEASE_VERSION}" --operation "${QUALIFY_MODE}"
            --wait-for-registry)
          # Recovery retains its original source and run context after approval.
          if [[ "${QUALIFY_MODE}" == recover ]]; then
            args+=(--original-run-id "${ORIGINAL_RUN_ID}"
              --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}")
          fi
          cargo xtask "${args[@]}"
        working-directory: policy

  finalization_approval:
    name: Approve source-only GitHub Releases
    needs:
      - qualify
      - publish
      - await_registry
    if: >-
      ${{ always() &&
          needs.qualify.result == 'success' &&
          needs.qualify.outputs.finalize == 'true' &&
          needs.await_registry.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This secretless deployment is the sole human gate between exact registry
    # visibility and the protected finalizer. A rerun requires a new recovery
    # dispatch rather than reusing an earlier approval.
    environment: release-finalization
    permissions: {}
    steps:
      - name: Require a fresh first-attempt approval
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "${RUN_ATTEMPT}" = "1"

  finalize:
    name: Finalize source-only GitHub Releases
    needs:
      - qualify
      - publish
      - await_registry
      - finalization_approval
    if: >-
      ${{ always() &&
          needs.qualify.result == 'success' &&
          needs.qualify.outputs.finalize == 'true' &&
          needs.await_registry.result == 'success' &&
          needs.finalization_approval.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
          github.run_attempt == 1 }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    environment: protected-automation
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      # A rerun of only this job cannot reuse an approval from attempt one.
      # Recovery starts a new bounded workflow_dispatch run instead.
      - name: Reject a reused finalization approval
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "${RUN_ATTEMPT}" = "1"

      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      # A moved main requires a fresh dispatch with its reviewed workflow policy.
      - name: Bind protected policy to the workflow commit
        run: test "$(git -C policy rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      # Rebind protected policy anonymously after the environment gate and
      # before any repository-write credential exists in the job.
      - name: Bind protected policy to anonymous live main
        env:
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          RELEASE_OPERATION: ${{ needs.qualify.outputs.operation }}
          QUALIFIED_VERSION: ${{ needs.qualify.outputs.version }}
        run: >-
          cargo xtask github release rebind-policy
          --base-ref "${BASE_REF}" --operation "${RELEASE_OPERATION}"
          --version "${QUALIFIED_VERSION}"
          --source-root ../release-source --source-sha "${SOURCE_SHA}"
        working-directory: policy

      # Mint a contents-only App token scoped to this one repository after all
      # source and registry qualification has completed.
      - name: Create repository-scoped finalizer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: NVIDIA
          repositories: yaml-sigil-rs
          permission-contents: write

      - name: Create or verify exact tags and Releases
        env:
          BASE_REF: ${{ needs.qualify.outputs.base_ref }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          RELEASE_OPERATION: ${{ needs.qualify.outputs.operation }}
        run: >-
          cargo xtask github release finalize --base-ref "${BASE_REF}"
          --operation "${RELEASE_OPERATION}"
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --version "${RELEASE_VERSION}"
          --app-slug "${APP_SLUG}"
        working-directory: policy
