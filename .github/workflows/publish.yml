name: Publish

# This workflow publishes only crates.io source packages. It never uploads or
# retains executable artifacts, installers, containers, or release assets.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Validate current main or recover one exact original run.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - recover
      source_sha:
        description: Full source SHA (current main for validation).
        required: true
        type: string
      original_run_id:
        description: Original main-push run ID (recovery only).
        required: false
        type: string
      original_run_attempt:
        description: Exact original attempt (recovery only).
        required: false
        type: string

permissions: {}

concurrency:
  group: yaml-sigil-publish-v2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact source release
    runs-on: linux-amd64-cpu8
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    outputs:
      source_sha: >-
        ${{ steps.auto.outputs.source_sha ||
            steps.validate.outputs.source_sha ||
            steps.recover.outputs.source_sha }}
      version: >-
        ${{ steps.auto.outputs.version ||
            steps.validate.outputs.version ||
            steps.recover.outputs.version }}
      publish: >-
        ${{ steps.auto.outputs.publish ||
            steps.validate.outputs.publish ||
            steps.recover.outputs.publish }}
      finalize: >-
        ${{ steps.auto.outputs.finalize ||
            steps.validate.outputs.finalize ||
            steps.recover.outputs.finalize }}
      registry_state: >-
        ${{ steps.auto.outputs.registry_state ||
            steps.validate.outputs.registry_state ||
            steps.recover.outputs.registry_state }}
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      - name: Check out exact requested source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Qualify automatic main release
        if: ${{ github.event_name == 'push' }}
        id: auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${GITHUB_SHA}"
          --operation auto
        working-directory: policy

      - name: Qualify validation-only dispatch
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.operation == 'validate' }}
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation validate
        working-directory: policy

      - name: Qualify same-source recovery
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.operation == 'recover' }}
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation recover
          --original-run-id "${ORIGINAL_RUN_ID}"
          --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}"
        working-directory: policy

      - name: Validate nonempty release source
        if: >-
          ${{ (steps.auto.outputs.registry_state ||
               steps.validate.outputs.registry_state ||
               steps.recover.outputs.registry_state) == 'none' }}
        env:
          RELEASE_VERSION: >-
            ${{ steps.auto.outputs.version ||
                steps.validate.outputs.version ||
                steps.recover.outputs.version }}
        run: |
          # Content policy proves the exact four source crates are coherent.
          cargo xtask release check --version "${RELEASE_VERSION}"
        working-directory: release-source

  publish:
    name: Publish missing source crates
    needs: qualify
    if: ${{ needs.qualify.outputs.publish == 'true' }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 75
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install exact release-plz
        run: |
          # Install the sole Cargo publisher at its reviewed version.
          cargo binstall --force --locked --no-confirm release-plz@0.3.160
          # Refuse publication if the reviewed binary version is not active.
          release-plz --version | grep -Fx 'release-plz 0.3.160'

      - name: Requalify automatic main source
        if: ${{ github.event_name == 'push' }}
        id: recheck-auto
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation auto
        working-directory: policy

      - name: Requalify exact recovery source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: recheck-recover
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation recover
          --original-run-id "${ORIGINAL_RUN_ID}"
          --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}"
        working-directory: policy

      - name: Attach exact source to local main publication refs
        if: >-
          ${{ steps.recheck-auto.outputs.publish == 'true' ||
              steps.recheck-recover.outputs.publish == 'true' }}
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: ../policy/.github/scripts/attach-release-source.sh "${SOURCE_SHA}"
        working-directory: release-source

      - name: Publish with release-plz
        if: >-
          ${{ steps.recheck-auto.outputs.publish == 'true' ||
              steps.recheck-recover.outputs.publish == 'true' }}
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          # Re-read anonymous live main as the last policy operation before the
          # sole publisher receives this step's read-scoped GitHub token.
          ../policy/.github/scripts/rebind-release-policy.sh \
            "NVIDIA/yaml-sigil-rs" ../policy . "${SOURCE_SHA}"
          # release-plz is the sole Cargo publisher and native tag/Release
          # creation is disabled; only this process receives Git association.
          GIT_TOKEN="${{ github.token }}" release-plz release \
            --config .release-plz.toml \
            --manifest-path Cargo.toml
        working-directory: release-source

  await_registry:
    name: Confirm exact published sources
    needs:
      - qualify
      - publish
    if: >-
      ${{ always() &&
          needs.qualify.result == 'success' &&
          needs.qualify.outputs.finalize == 'true' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Await automatic main publication
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation auto
          --wait-for-registry
        working-directory: policy

      - name: Await same-source recovery publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          cargo xtask github release qualify
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --operation recover
          --original-run-id "${ORIGINAL_RUN_ID}"
          --original-run-attempt "${ORIGINAL_RUN_ATTEMPT}"
          --wait-for-registry
        working-directory: policy

  finalize:
    name: Finalize source-only GitHub Releases
    needs:
      - qualify
      - publish
      - await_registry
    if: >-
      ${{ always() &&
          needs.qualify.result == 'success' &&
          needs.qualify.outputs.finalize == 'true' &&
          needs.await_registry.result == 'success' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    environment: protected-automation
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - name: Check out protected current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: refs/heads/main

      - name: Check out qualified source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      # Rebind protected policy anonymously after the environment gate and
      # before any repository-write credential exists in the job.
      - name: Bind protected policy to anonymous live main
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          policy/.github/scripts/rebind-release-policy.sh
          "NVIDIA/yaml-sigil-rs" policy release-source "${SOURCE_SHA}"

      # Mint a contents-only App token scoped to this one repository after all
      # source and registry qualification has completed.
      - name: Create repository-scoped finalizer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: NVIDIA
          repositories: yaml-sigil-rs
          permission-contents: write

      - name: Create or verify exact tags and Releases
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: >-
          cargo xtask github release finalize
          --source-root ../release-source
          --source-sha "${SOURCE_SHA}"
          --version "${RELEASE_VERSION}"
          --app-slug "${APP_SLUG}"
        working-directory: policy
