name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: GitHub Actions
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: .github/scripts
          version: v0.11.0

      - name: Compile and test automation controllers
        run: |
          python3 -m py_compile \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_*.py'

  platform_verifier:
    name: Protected checkout verifier (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the checkout verifier on each supported host, including a
      # real Windows directory junction rather than a mocked reparse point.
      - name: Compile and test protected checkout verifier
        shell: bash
        run: |
          python3 -m py_compile \
            .github/scripts/protected_checkout.py \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_protected_pr_ci.py'

  static_checks:
    name: Documentation and Protobuf
    runs-on: linux-amd64-cpu4
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          version: "0.2.54"

      - name: Check Protobuf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          archive: false
          breaking: false
          format: true
          input: crates/yaml-sigil-core
          lint: true
          pr_comment: false
          push: false
          version: "1.72.0"

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: linux-amd64-cpu8
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused preinstalled Homebrew source
        if: ${{ runner.os == 'macOS' }}
        run: .github/scripts/remove-preinstalled-aws-tap.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-machete@0.9.2

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            xtask -> target

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --all --check

      - name: Check synchronized release versions
        run: cargo xtask release-version check

      # Compare modeled source-package paths for core, transcription, signing,
      # and verification with their committed exact inventories. This does not
      # assemble archives or publish crates.
      - name: Check package contents
        run: cargo xtask package-content

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint xtask
        run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test xtask
        run: cargo test --locked --manifest-path xtask/Cargo.toml

      - name: Check unused Rust dependencies
        run: cargo-machete --with-metadata

      # Audit after the Cargo checks have resolved this platform's dependency
      # graph and generated the intentionally untracked root Cargo.lock.
      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit xtask dependencies
        run: cargo audit --file xtask/Cargo.lock

  required_ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - workflow_lint
      - platform_verifier
      - static_checks
      - rust
    permissions: {}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        env:
          GITHUB_ACTIONS_RESULT: ${{ needs.workflow_lint.result }}
          PLATFORM_VERIFIER_RESULT: ${{ needs.platform_verifier.result }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          require_success() {
            local job="$1"
            local result="$2"
            # Aggregate every required job, including the whole OS matrix.
            if [[ "${result}" != "success" ]]; then
              printf '%s finished with result %s; success is required.\n' \
                "${job}" "${result}"
              exit 1
            fi
          }

          require_success "GitHub Actions" "${GITHUB_ACTIONS_RESULT}"
          require_success "Protected checkout verifier matrix" "${PLATFORM_VERIFIER_RESULT}"
          require_success "Documentation and Protobuf" "${STATIC_RESULT}"
          require_success "Rust matrix" "${RUST_RESULT}"
