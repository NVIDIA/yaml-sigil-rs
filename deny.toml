[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Apache-2.0",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
unused-license-exception = "deny"
include-dev = true
include-build = true

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "foldhash@0.1.5", reason = "Buffa and the parser stack use different hashbrown dependency lines." },
    { crate = "getrandom@0.2.17", reason = "ring retains getrandom 0.2 while RustCrypto uses 0.4." },
    { crate = "getrandom@0.3.4", reason = "The JSON Schema stack currently uses ahash with getrandom 0.3." },
    { crate = "hashbrown@0.15.5", reason = "Buffa and the parser stack use different hashbrown dependency lines." },
    { crate = "num-bigint@0.4.8", reason = "The JSON Schema stack requires num-bigint 0.4 while the SSH-agent example uses 0.5." },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 retains the earlier WASI ABI support line." },
    { crate = "sha3@0.11.0", reason = "The SSH-agent example uses sha3 0.12 through russh, whose ml-kem dependency still requires 0.11." },
    { crate = "syn@2.0.119", reason = "Buffa and cryptographic macros retain syn 2 while newer derives use syn 3." },
    { crate = "windows-sys@0.52.0", reason = "ring retains windows-sys 0.52 while current tooling uses 0.61." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
