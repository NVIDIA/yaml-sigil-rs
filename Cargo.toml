[workspace]
resolver = "3"
# Cargo package verification resolves development dependencies. Keep signing
# before verification so release-plz publishes it before verifying the latter.
members = [
    "crates/yaml-sigil-core",
    "crates/yaml-sigil-transcription",
    "crates/yaml-sigil-signing",
    "crates/yaml-sigil-verification",
    "crates/yaml-sigil-wasm",
    "crates/yaml-sigil-test-keys",
    "crates/yaml-sigil-conformance",
    "examples",
]
exclude = [
    "tests/downstream/buffa-0-5",
    "tests/downstream/core-only",
    "tests/downstream/noyalib-0-0-35",
    "tests/downstream/resource-api",
    "tests/downstream/v1alpha1-api",
]

[workspace.package]
version = "0.6.0"
authors = ["yaml-sigil-dev <yaml-sigil-dev+crates-io@nvidia.com>"]
edition = "2024"
# TODO: We seek to reduce this, we just need to do the testing.
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/yaml-sigil-rs"
publish = false

# In-workspace crates use `path` + `version` for local development.
# Bump only `version` in `[workspace.package]` above, then `cargo xtask sync-workspace-versions`.
# Members inherit via `{ workspace = true }` per https://doc.rust-lang.org/cargo/reference/workspaces.html#the-dependencies-table
[workspace.dependencies]
yaml-sigil-core = { version = "0.6.0", path = "crates/yaml-sigil-core", default-features = false }
# External split crate; publication validation resolves this exact version
# from crates.io before any implementation crate can be released.
yaml-sigil-traits = { version = "=0.4.1", default-features = false }
yaml-sigil-transcription = { version = "0.6.0", path = "crates/yaml-sigil-transcription", default-features = false }
yaml-sigil-verification = { version = "0.6.0", path = "crates/yaml-sigil-verification", default-features = false }
yaml-sigil-signing = { version = "0.6.0", path = "crates/yaml-sigil-signing", default-features = false }

base64 = { version = "0.23.1", default-features = false, features = ["std"] }
buf-tools = ">=1.73.0"
buffa = "=0.9.2"
buffa-build = "=0.9.2"
curve25519-dalek = "5.0"
# Keep precomputed tables explicit for workspace consumers with defaults off.
ed25519-dalek = { version = "3.0", default-features = false, features = [
    "alloc",
    "fast",
    "rand_core",
    "zeroize",
] }
js-sys = { version = "=0.3.105", default-features = false, features = ["std"] }
jsonschema = { version = "0.56.0", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }
serde_json = "1.0"
sha2 = "0.11"
signature = "3.0"
noyalib = { version = "0.0.46", default-features = false, features = ["std"] }
tracing = "0.1"
tokio = { version = "1", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-test = "=0.3.78"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Release-equivalent optimization with symbols retained for samply.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
