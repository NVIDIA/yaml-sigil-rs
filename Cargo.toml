[workspace]
resolver = "3"
members = [
    "crates/yaml-sigil-core",
    "crates/yaml-sigil-transcription",
    "crates/yaml-sigil-verification",
    "crates/yaml-sigil-signing",
    "crates/yaml-sigil-test-keys",
    "crates/yaml-sigil-conformance",
]

[workspace.package]
version = "0.3.1-rc.1"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-dev/yaml-sigil-rs"
publish = false

# In-workspace crates use `path` + `version` for local development.
# Bump only `version` in `[workspace.package]` above, then `cargo xtask sync-workspace-versions`.
# Members inherit via `{ workspace = true }` per https://doc.rust-lang.org/cargo/reference/workspaces.html#the-dependencies-table
[workspace.dependencies]
yaml-sigil-core = { version = "0.3.1-rc.1", path = "crates/yaml-sigil-core", default-features = false }
# External split crate; use the GitHub repository until it is published.
yaml-sigil-traits = { version = "0.3.0-rc.1", git = "https://github.com/NVIDIA-dev/yaml-sigil-traits.git", default-features = false }
yaml-sigil-transcription = { version = "0.3.1-rc.1", path = "crates/yaml-sigil-transcription", default-features = false }
yaml-sigil-verification = { version = "0.3.1-rc.1", path = "crates/yaml-sigil-verification", default-features = false }
yaml-sigil-signing = { version = "0.3.1-rc.1", path = "crates/yaml-sigil-signing", default-features = false }

base64 = "0.22"
buffa = "0.5"
buffa-build = "0.5"
ecdsa = { version = "0.16", default-features = false, features = ["pem"] }
ed25519-dalek = { version = "2.1", default-features = false, features = [
    "alloc",
    "rand_core",
] }
jsonschema = { version = "0.46.5", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
noyalib = { version = "0.0.13", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
signature = { version = "2.2", default-features = false }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
