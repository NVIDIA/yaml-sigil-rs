[workspace]
resolver = "3"
# Cargo package verification resolves development dependencies. Keep signing
# before verification so release-plz publishes it before verifying the latter.
members = [
    "crates/yaml-sigil-core",
    "crates/yaml-sigil-transcription",
    "crates/yaml-sigil-signing",
    "crates/yaml-sigil-verification",
    "crates/yaml-sigil-test-keys",
    "crates/yaml-sigil-conformance",
]

[workspace.package]
version = "0.5.0-rc.1"
authors = ["yaml-sigil-dev <yaml-sigil-dev+crates-io@nvidia.com>"]
edition = "2024"
# TODO: We seek to reduce this, we just need to do the testing.
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/yaml-sigil-rs"
publish = false

# In-workspace crates use `path` + `version` for local development.
# Bump only `version` in `[workspace.package]` above, then `cargo xtask sync-workspace-versions`.
# Members inherit via `{ workspace = true }` per https://doc.rust-lang.org/cargo/reference/workspaces.html#the-dependencies-table
[workspace.dependencies]
yaml-sigil-core = { version = "0.5.0-rc.1", path = "crates/yaml-sigil-core", default-features = false }
# External split crate; publication validation resolves this exact prerelease
# from crates.io before any implementation crate can be released.
yaml-sigil-traits = { version = "=0.4.0-rc.1", default-features = false }
yaml-sigil-transcription = { version = "0.5.0-rc.1", path = "crates/yaml-sigil-transcription", default-features = false }
yaml-sigil-verification = { version = "0.5.0-rc.1", path = "crates/yaml-sigil-verification", default-features = false }
yaml-sigil-signing = { version = "0.5.0-rc.1", path = "crates/yaml-sigil-signing", default-features = false }

base64 = "0.22"
buf-tools = "=1.72.0-hotfix.1"
buffa = "0.5"
buffa-build = "0.5"
# Keep precomputed tables explicit for workspace consumers with defaults off.
ed25519-dalek = { version = "2.1", default-features = false, features = [
    "alloc",
    "fast",
    "rand_core",
] }
jsonschema = { version = "0.46.5", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1.0"
noyalib = { version = "0.0.26", default-features = false, features = ["std"] }
tracing = "0.1"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Release-equivalent optimization with symbols retained for samply.
[profile.profiling]
inherits = "release"
debug = true
