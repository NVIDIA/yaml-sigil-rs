syntax = "proto3";

package compat.v1;

// Test-only schema with the YamlSigil v1alpha1 field numbers and wire types.
message CompatArtifact {
  bytes payload = 1;
  CompatSignature signature = 2;
}

enum CompatAlgorithm {
  COMPAT_ALGORITHM_UNSPECIFIED = 0;
  COMPAT_ALGORITHM_ED25519 = 1;
  COMPAT_ALGORITHM_ECDSA_P256_SHA256 = 2;
}

message CompatSignature {
  CompatAlgorithm alg = 1;
  optional string keyid = 2;
  bytes signature = 3;
}
