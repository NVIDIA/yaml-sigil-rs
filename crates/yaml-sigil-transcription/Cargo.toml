[package]
name = "yaml-sigil-transcription"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# Keep CI, package, and release target discovery deterministic. This crate has
# no integration-test targets.
autobenches = false
autoexamples = false
autotests = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Compose and decompose YAML and protobuf documents"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "protobuf", "in-toto", "serialization", "transcription"]
categories = ["encoding", "parser-implementations"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
