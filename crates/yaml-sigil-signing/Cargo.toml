[package]
name = "yaml-sigil-signing"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# Keep CI, package, and release target discovery deterministic. This crate has
# no integration-test targets.
autobenches = false
autoexamples = false
autotests = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Create signed YAML and protobuf documents"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "ed25519", "ecdsa"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"], optional = true }
ed25519-dalek = { workspace = true, optional = true }
# Use the system CSPRNG, including Web Crypto on browser/Node.js WebAssembly.
getrandom = { version = "0.4", default-features = false, features = ["sys_rng", "wasm_js"], optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
signature = { workspace = true, optional = true }
thiserror = { version = "2", default-features = false, optional = true }
tracing = { workspace = true, optional = true }
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }
zeroize = { workspace = true, optional = true }

rand_core = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std", "yaml", "protobuf", "system-rng"]
alloc = ["yaml-sigil-core/alloc", "yaml-sigil-core/p256-encoding", "yaml-sigil-traits/alloc", "yaml-sigil-transcription/alloc", "dep:base64", "dep:curve25519-dalek", "dep:ecdsa", "dep:ed25519-dalek", "dep:p256", "dep:sha2", "dep:signature", "dep:thiserror", "dep:zeroize", "dep:rand_core"]
std = ["alloc", "yaml-sigil-core/std", "yaml-sigil-traits/std", "yaml-sigil-transcription/std", "dep:tracing", "tracing/std"]
yaml = ["alloc", "yaml-sigil-core/yaml", "yaml-sigil-transcription/yaml"]
protobuf = ["alloc", "yaml-sigil-core/protobuf", "yaml-sigil-transcription/protobuf"]
system-rng = ["alloc", "dep:getrandom"]
json-schema-validate = ["std", "yaml", "yaml-sigil-core/json-schema-validate"]
