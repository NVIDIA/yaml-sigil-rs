[package]
name = "yaml-sigil-signing"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "YamlSigil v1alpha1 signing API (YAML + protobuf)"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

include = [
    "/src/**",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]

[lints]
workspace = true

[dependencies]
base64 = "0.22"
buffa = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
thiserror = "2"
tracing = "0.1"
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
json-schema-validate = ["yaml-sigil-core/json-schema-validate"]
