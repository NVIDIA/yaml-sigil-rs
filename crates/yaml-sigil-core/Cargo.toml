[package]
name = "yaml-sigil-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# Keep CI, package, and release target discovery deterministic. Integration
# tests remain auto-discovered because they are part of validation.
autobenches = false
autoexamples = false
# Bind the required code generator explicitly instead of auto-discovering it.
build = "build.rs"
rust-version.workspace = true
description = "Parsing, encoding, and shared document support for YAML Sigil"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "protobuf", "digital-signature", "in-toto", "parser"]
categories = ["encoding", "parser-implementations"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/build.rs",
    "/buf.yaml",
    "/spec/proto/**",
    "/spec/schema/YamlSigilSignature.v1alpha1.schema.json",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

# Both dependencies are invoked directly by build.rs.
[package.metadata.cargo-machete]
ignored = ["buf-tools", "buffa-build"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "yaml", "protobuf"]
alloc = ["yaml-sigil-traits/alloc", "base64?/alloc", "serde?/alloc"]
std = ["alloc", "yaml-sigil-traits/std", "base64?/std", "serde?/std", "noyalib?/std", "buffa?/std", "dep:tracing", "tracing/std", "thiserror/std"]
yaml = ["alloc", "dep:base64", "dep:serde", "dep:noyalib"]
protobuf = ["alloc", "dep:buffa", "dep:buf-tools", "dep:buffa-build"]
json-schema-validate = ["std", "yaml", "dep:jsonschema", "dep:serde_json"]
p256-encoding = ["dep:p256"]

[dependencies]
base64 = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
noyalib = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
thiserror = { version = "2", default-features = false }
tracing = { workspace = true, optional = true }
yaml-sigil-traits = { workspace = true, default-features = false }
buffa = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
buf-tools = { workspace = true, optional = true }
buffa-build = { workspace = true, optional = true }

[dev-dependencies]
jsonschema = { workspace = true }
serde_json = { workspace = true }
