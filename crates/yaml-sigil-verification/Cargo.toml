[package]
name = "yaml-sigil-verification"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# Keep CI, package, and release target discovery deterministic. Integration
# tests remain auto-discovered because they are part of validation.
autobenches = false
autoexamples = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Verify documents and signatures"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "verification", "cryptography"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

[lints]
workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
curve25519-dalek = "4.1"
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
sha2 = "0.10"
signature = { workspace = true }
tracing = "0.1"
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }

[features]
json-schema-validate = ["yaml-sigil-core/json-schema-validate"]

[dev-dependencies]
# These adapters test interoperability. The non-fips backend avoids
# FIPS-specific build-tool and platform requirements beyond these tests.
# Keep provider tests runnable on Windows x86-64 hosts without NASM, including
# when this package is tested separately from the examples workspace member.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }
rand_core = { workspace = true }
ring = "=0.17.14"
tokio = { workspace = true, features = ["macros", "rt"] }
yaml-sigil-signing = { workspace = true }
