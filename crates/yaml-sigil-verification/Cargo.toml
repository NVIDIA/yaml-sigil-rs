[package]
name = "yaml-sigil-verification"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# Keep CI, package, and release target discovery deterministic. Integration
# tests remain auto-discovered because they are part of validation.
autobenches = false
autoexamples = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Verify documents and signatures"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "verification", "cryptography"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
curve25519-dalek = "4.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10"
signature = "2.2"
tracing = "0.1"
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }

[features]
json-schema-validate = ["yaml-sigil-core/json-schema-validate"]

[dev-dependencies]
buffa = { workspace = true }
rand_core = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
yaml-sigil-signing = { workspace = true }
