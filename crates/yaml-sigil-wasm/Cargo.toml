[package]
name = "yaml-sigil-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser WebAssembly boundary for YamlSigil v1alpha1"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["yaml", "wasm", "digital-signature", "ed25519", "ecdsa"]
categories = ["authentication", "cryptography", "wasm"]
include = [
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]
# Keep this source-only boundary free of automatically discovered executables.
autobins = false
autobenches = false
autoexamples = false
# The integration tests are intentional, and the crate has no build script.
autotests = true
build = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
browser-tests = []
json-schema-validate = [
    "yaml-sigil-core/json-schema-validate",
    "yaml-sigil-signing/json-schema-validate",
    "yaml-sigil-verification/json-schema-validate",
]

[dependencies]
ed25519-dalek = { workspace = true }
js-sys = { workspace = true }
p256 = { workspace = true }
wasm-bindgen = { workspace = true }
yaml-sigil-core = { workspace = true }
yaml-sigil-signing = { workspace = true }
yaml-sigil-transcription = { workspace = true }
yaml-sigil-verification = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
console_error_panic_hook = "0.1"
# Only test fixtures construct JavaScript functions from source strings.
js-sys = { workspace = true, features = ["unsafe-eval"] }
wasm-bindgen-test = { workspace = true }
