[workspace]
release = false
release_always = true
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish_allow_dirty = true
# PR snapshots are fully packaged and verified in the preceding no-OIDC job.
# Skip duplicate builds and registry dependency races while publishing the
# synchronized source packages in their established order.
publish_no_verify = true
publish_timeout = "5m"

[[package]]
name = "yaml-sigil-core"
version_group = "yaml-sigil-rs"
release = true
publish = true
publish_all_features = true
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish_allow_dirty = true
publish_no_verify = true

