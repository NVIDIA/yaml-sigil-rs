# rumdl — Markdown layout for this repository.
# See AGENTS.md: prose ~80 cols; do not break fenced code, emphasis, or links.

[global]
line-length = 80
cache-dir = ".rumdl_cache"
respect-gitignore = true
exclude = [
    ".git",
    "target",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[MD013]
reflow = false
reflow-mode = "default"
code-blocks = false
tables = false
headings = false
paragraphs = true
blockquotes = true
strict = false
