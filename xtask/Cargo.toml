[workspace]

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
# This developer tool has no build script.
build = false
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
buf-tools = "=1.72.0-hotfix.1"
clap = { version = "4.5", features = ["derive"] }
semver = "1.0"
serde_json = "1.0"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
