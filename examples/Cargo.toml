[package]
name = "yaml-sigil-examples"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable examples of the yaml-sigil APIs"
publish = false
autobins = false
autobenches = false
autoexamples = false
autotests = false
build = false

[lints]
workspace = true

[dev-dependencies]
# These groups describe usage, including shared modules and tests. Cargo makes
# every entry available to every example target; the groups do not gate builds.

# Every example: error handling and public document/artifact types.
anyhow = "1.0"
yaml-sigil-core = { workspace = true }

# ring-provider, aws-lc-provider, ring-unqualified-provider, and async-provider:
# CLI arguments, public-key display, signing/verification traits, and facades.
base64 = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
signature = { workspace = true }
yaml-sigil-signing = { workspace = true }
yaml-sigil-verification = { workspace = true }

# The four provider examples' file-input tests.
tempfile = "3"

# ring-provider and ring-unqualified-provider: shared native ring adapters.
ring = "=0.17.14"

# aws-lc-provider: native aws-lc-rs adapters. The non-fips backend avoids
# FIPS-specific build-tool and platform requirements beyond this example.
# Keep Windows x86-64 examples runnable when NASM is absent from the host.
# The provider uses its bundled assembly objects only as a fallback there.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }

# async-provider: P-256 and key generation in the simulated service worker,
# plus its Tokio runtime, request/reply channels, and asynchronous tests.
p256 = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

# protobuf-facade: application-owned message types and both wire directions.
prost = "=0.14.4"

# github-keys: OpenSSH key decoding/decryption, native Ed25519 signing,
# hidden passphrase input, secret-buffer cleanup, and anonymous HTTPS.
# Its std feature pulls optional crypto backends into Cargo.lock. Keep file I/O
# here so inactive RSA operations do not add an unrelated advisory to the graph.
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "ecdsa", "ed25519", "encryption"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
rpassword = "7.5"
zeroize = "1.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# github-keys: both anonymous GitHub account-key APIs return paginated JSON.
serde_json = { workspace = true }

# Execute the parser and round-trip tests in cargo test --workspace.
[[example]]
name = "ring-provider"
path = "ring_provider.rs"
test = true

[[example]]
name = "aws-lc-provider"
path = "aws_lc_provider.rs"
test = true

[[example]]
name = "ring-unqualified-provider"
path = "ring_unqualified_provider.rs"
test = true

[[example]]
name = "async-provider"
path = "async_provider.rs"
test = true

[[example]]
name = "yaml-facade"
path = "yaml_facade.rs"
test = true

[[example]]
name = "protobuf-facade"
path = "protobuf_facade.rs"
test = true

[[example]]
name = "github-keys"
path = "github-keys/main.rs"
test = true
