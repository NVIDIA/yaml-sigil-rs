[package]
name = "yaml-sigil-examples"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable examples of the yaml-sigil APIs"
publish = false
autobins = false
autobenches = false
autoexamples = false
autotests = false
build = false

[lints]
workspace = true

[dev-dependencies]
# These groups describe usage, including example tests. Cargo makes every
# entry available to every example target; the groups do not gate builds.

# github-keys: CLI, errors, and public signing/verification APIs.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
yaml-sigil-core = { workspace = true }
yaml-sigil-signing = { workspace = true }
yaml-sigil-verification = { workspace = true }

# github-keys: OpenSSH key decoding/decryption, native Ed25519 signing,
# hidden passphrase input, secret-buffer cleanup, and anonymous HTTPS.
# Its std feature pulls optional crypto backends into Cargo.lock. Keep file I/O
# here so inactive RSA operations do not add an unrelated advisory to the graph.
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "ecdsa", "ed25519", "encryption"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
rpassword = "7.5"
zeroize = "1.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# github-keys: both anonymous GitHub account-key APIs return paginated JSON.
serde_json = { workspace = true }

# github-keys tests: temporary files, encrypted synthetic keys, signature
# mutations, and the P-256 adaptation documented in its README.
tempfile = "3"
rand_core = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }

[[example]]
name = "github-keys"
path = "github-keys/main.rs"
test = true
