[package]
name = "yaml-sigil-examples"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable examples of the yaml-sigil APIs"
publish = false
autobins = false
autobenches = false
autoexamples = false
autotests = false
build = false

[lints]
workspace = true

[dev-dependencies]
# These groups describe usage, including shared modules and tests. Cargo makes
# every entry available to every example target; the groups do not gate builds.

# Every example: error handling and public document/artifact types.
anyhow = "1.0"
yaml-sigil-core = { workspace = true }

# ring-provider, aws-lc-provider, ring-unqualified-provider, async-provider,
# and github-keys:
# CLI arguments, public-key display, signing/verification traits, and facades.
base64 = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
signature = { workspace = true }
yaml-sigil-signing = { workspace = true }
yaml-sigil-verification = { workspace = true }

# Provider and github-keys file-input tests.
tempfile = "3"

# ring-provider and ring-unqualified-provider: shared native ring adapters.
ring = "=0.17.14"

# aws-lc-provider: native aws-lc-rs adapters. The non-fips backend avoids
# FIPS-specific build-tool and platform requirements beyond this example.
# Keep Windows x86-64 examples runnable when NASM is absent from the host.
# The provider uses its bundled assembly objects only as a fallback there.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }

# async-provider and github-keys: P-256 worker keys and the adaptation recipe test.
p256 = { workspace = true }
# async-provider: key generation in the simulated service worker.
rand = { workspace = true }
# async-provider and github-keys: runtime, channels, agent I/O, and timed tests.
tokio = { workspace = true, features = ["macros", "rt", "sync", "net", "time", "io-util", "test-util"] }

# github-keys: SSH-agent transport and OpenSSH public-key decoding. The agent
# owns private keys; RSA and SSH compression are not needed by this example.
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
# github-keys: anonymous HTTPS discovery, JSON responses, and local verification.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }

# protobuf-facade: application-owned message types and both wire directions.
prost = "=0.14.4"

# Execute the parser and round-trip tests in cargo test --workspace.
[[example]]
name = "ring-provider"
path = "ring_provider.rs"
test = true

[[example]]
name = "aws-lc-provider"
path = "aws_lc_provider.rs"
test = true

[[example]]
name = "ring-unqualified-provider"
path = "ring_unqualified_provider.rs"
test = true

[[example]]
name = "async-provider"
path = "async_provider.rs"
test = true

[[example]]
name = "yaml-facade"
path = "yaml_facade.rs"
test = true

[[example]]
name = "protobuf-facade"
path = "protobuf_facade.rs"
test = true

[[example]]
name = "github-keys"
path = "github-keys/main.rs"
test = true
